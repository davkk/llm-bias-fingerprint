<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>runs</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #000;
        color: #e6e9ef;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }

      .top {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8b93a7;
        display: inline-block;
      }

      .dot.ok {
        background: #3fb950;
      }

      .dot.err {
        background: #f85149;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 6px 8px;
        border-bottom: 1px solid #222;
        text-align: left;
        white-space: nowrap;
      }

      th {
        font-size: 11px;
        text-transform: uppercase;
        color: #8b93a7;
      }

      .bar {
        width: 100px;
        height: 5px;
        background: #111;
        border-radius: 999px;
        overflow: hidden;
        display: inline-block;
        vertical-align: middle;
      }

      .fill {
        height: 100%;
        background: #4c8dff;
      }

      .chip {
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 999px;
        background: #111;
      }

      .btn {
        background: #111;
        color: #e6e9ef;
        border: 1px solid #222;
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 12px;
        cursor: pointer;
      }

      .vals {
        color: #555;
      }

      .vals code {
        display: inline-block;
        background: #222;
        border: 1px solid #333;
        border-radius: 3px;
        padding: 0 4px;
        margin: 1px 3px 1px 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <strong>runs</strong>
      <span>
        <span id="dot" class="dot"></span>
        <span id="status">connecting</span>
      </span>
      <span style="flex: 1"></span>
      <span id="updated">—</span>
      <button id="pause" class="btn">pause</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>id</th>
          <th>experiment</th>
          <th>model</th>
          <th>status</th>
          <th>progress</th>
          <th>samples</th>
          <th>lease</th>
          <th>recent values</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>

    <p id="empty" style="color: #8b93a7">connecting…</p>

    <script src="dashboard.js?v=10"></script>
  </body>
</html>
